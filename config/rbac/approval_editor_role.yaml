# This rule is not used by the project kokumi itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read access to Approvals. Approvals can only be submitted through
# the kokumi server (enforced by the approval-integrity admission policy).

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: approval-editor-role
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - approvals
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - approvals/status
  verbs:
  - get
